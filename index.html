<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Document</title>
</head>

<body
    class="min-h-screen bg-linear-65 from-purple-400 to-purple-50 p-4 sm:p-6 md:p-10 flex items-center justify-center">

    <section class="w-full max-w-4xl overflow-hidden rounded-2xl shadow-xl grid grid-cols-1 lg:grid-cols-2">

        <div
            class="bg-[url('./assets/img/yolgezer-ai-generated-9248643.jpg')] bg-cover bg-center text-white px-6 py-16 sm:px-8 md:px-12 lg:px-16 lg:py-40">
            <div class="text-center">
                <h1 class="font-semibold text-3xl sm:text-4xl break-words">Welcome</h1>
            </div>

            <p class="mt-5 text-sm sm:text-base break-words">
                Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nulla nemo sunt, odit necessitatibus
                <a href="" class="text-purple-400">Learn More</a>
            </p>
        </div>

        <div class="bg-white px-4 py-8 sm:px-6 md:px-8 md:py-12 min-w-0">
            <h1 class="font-semibold text-2xl sm:text-3xl break-words">Register</h1>

            <p class="mt-4 text-sm sm:text-base break-words">
                Create your account. It's free and only take a minute
            </p>

            <form action="" class="mt-6 space-y-5">

                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" placeholder="First Name" class="border border-gray-500 p-2 w-full ">
                    <input type="text" placeholder="Last Name" class="border border-gray-500 p-2 w-full">
                </div>

                <input type="text" placeholder="Email" class="border border-gray-500 p-2 w-full">
                <input type="text" placeholder="Password" class="border border-gray-500 p-2 w-full">
                <input type="text" placeholder="Confirm Password" class="border border-gray-500 p-2 w-full">

                <div class="flex items-center gap-3">
                    <input type="checkbox" class="h-4 w-4 mt-1 shrink-0">
                    <p class="text-sm break-words">
                        I accept the
                        <a href="" class="text-purple-400">Terms of use</a> &
                        <a href="" class="text-purple-400">Privacy policy</a>
                    </p>
                </div>

                <button
                    class="bg-purple-800/60 py-3 text-white font-semibold w-full cursor-pointer hover:bg-purple-800/50 break-words">
                    Register Now
                </button>

            </form>
        </div>

    </section>

</body>

</html>
